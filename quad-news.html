<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-Way Live News</title>
<style>
html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:100vh;gap:2px;background:#111}
.tile{position:relative;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;background:#000}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:8px;background:rgba(0,0,0,.6)}
select,button{font-size:16px;padding:6px 8px}
select{max-width:70%}
.status{margin-left:auto;font-size:12px;opacity:.85}
@media(max-width:800px){.grid{grid-template-columns:1fr;grid-template-rows:repeat(4,50vh);height:auto}}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const channels = [
  ["Bloomberg TV US","https://www.bloomberg.com/media-manifest/streams/phoenix-us.m3u8"],
  ["Al Jazeera Arabic","https://live-hls-apps-aja-fa.getaj.net/AJA/01.m3u8"],
  ["Sky News Arabia","https://live-stream.skynewsarabia.com/c-horizontal-channel/horizontal-stream/index.m3u8"],
  ["Asharq News","https://live-news.asharq.com/asharq.m3u8"],
  ["Al Jazeera English","https://live-hls-web-aje-fa.thehlive.com/AJE/index.m3u8"],
  ["France 24 English","https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_5000.m3u8"],
  ["France 24 Arabic","https://live.france24.com/hls/live/2037222-b/F24_AR_HI_HLS/master_5000.m3u8"],
  ["DW English","https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/master.m3u8"],
  ["DW Arabic","https://dwamdstream103.akamaized.net/hls/live/2015526/dwstream103/master.m3u8"],
  ["Al Hadath","https://shd-gcp-live.edgenextcdn.net/live/bitmovin-hadath/2ff87ec4c2f3ede35295a20637d9f8fd/index.m3u8"],
  ["Al Mayadeen","https://mdnlv.cdn.octivid.com/almdn/smil:mpegts.stream.smil/playlist.m3u8"],
  ["BFM Business","https://live-cdn-stream-euw1.bfmb.bct.nextradiotv.com/master.m3u8"]
];
const defaults=[0,1,2,3];
const grid=document.getElementById("grid");
const players=[];

function attach(video,url,status){
  if(video._hls){video._hls.destroy();video._hls=null}
  status.textContent="loading";
  if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=url;
    video.play().then(()=>status.textContent="live").catch(()=>status.textContent="tap play");
  }else if(window.Hls && Hls.isSupported()){
    const hls=new Hls({enableWorker:true,lowLatencyMode:false});
    video._hls=hls;
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().then(()=>status.textContent="live").catch(()=>status.textContent="tap play"));
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal) status.textContent="stream error"});
  }else{
    status.textContent="HLS unsupported";
  }
}

for(let i=0;i<4;i++){
  const tile=document.createElement("div"); tile.className="tile";
  const v=document.createElement("video"); v.autoplay=true; v.muted=true; v.playsInline=true; v.controls=true;
  const bar=document.createElement("div"); bar.className="bar";
  const sel=document.createElement("select");
  channels.forEach((c,idx)=>{const o=document.createElement("option");o.value=idx;o.textContent=c[0];if(idx===defaults[i])o.selected=true;sel.appendChild(o)});
  const audio=document.createElement("button"); audio.textContent="Audio";
  const status=document.createElement("span"); status.className="status";
  bar.append(sel,audio,status); tile.append(v,bar); grid.appendChild(tile);
  players.push(v);
  sel.addEventListener("change",()=>attach(v,channels[+sel.value][1],status));
  audio.addEventListener("click",()=>{
    players.forEach(p=>p.muted=true);
    v.muted=false; v.play().catch(()=>{});
  });
  attach(v,channels[defaults[i]][1],status);
}
</script>
</body>
</html>
